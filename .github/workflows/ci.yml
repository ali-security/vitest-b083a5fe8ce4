name: CI

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Optional test name filter; empty runs the full suite
        required: false
        default: ''
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  VITEST_GENERATE_UI_TOKEN: 'true'

jobs:
  test:
    name: 'Build&Test: node-${{ matrix.node_version }}, ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [18, 20, 22, 24]
        include:
          - os: macos-latest
            node_version: 20
          - os: windows-latest
            node_version: 20
      fail-fast: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: ${{ matrix.node_version }}

      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3

      - name: Install
        run: pnpm i

      - name: Install Playwright Dependencies
        run: pnpm exec playwright install chromium --with-deps --only-shell

      - name: Build
        run: pnpm run build

      # seal: upstream publishes via `pnpm -r stage publish` and has no
      # artifact-producing workflow, so pack the release tarball here.
      - name: Pack @vitest/mocker
        if: matrix.os == 'ubuntu-latest' && matrix.node_version == 24
        working-directory: packages/mocker
        run: |
          pnpm pack --pack-destination ../../seal-dist
          mv ../../seal-dist/vitest-mocker-3.2.7.tgz ../../seal-dist/mocker-3.2.7.tgz

      - name: Upload @vitest/mocker tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node_version == 24
        uses: actions/upload-artifact@v4
        with:
          name: mocker-3.2.7-tgz
          path: seal-dist/mocker-3.2.7.tgz
          if-no-files-found: error

      - name: Test
        if: inputs.test-filter == ''
        run: pnpm run test:ci

      # seal: a bare filename filter cannot be broadcast to every `@vitest/test-*`
      # package — `tsc -b -- <filter>` (test-dts-config, test-dts-playwright),
      # `playwright test` (test-ui) and the multi-step `pnpm a && pnpm b` scripts
      # all fail on the extra argument, and a plain `vitest` suite with no
      # matching file exits 1. So the input carries the whole pnpm tail instead,
      # e.g. `--filter @vitest/test-cli run test -- some-file`. The unfiltered
      # `Test` step above is untouched and remains the correctness gate.
      - name: Test (filtered)
        if: inputs.test-filter != ''
        shell: bash
        run: CI=true pnpm -r --reporter-hide-prefix --stream --sequential ${{ inputs.test-filter }}

      - name: Test Examples
        run: pnpm run test:examples

      - name: Unit Test UI
        run: pnpm run -C packages/ui test:ui

  test-browser:
    name: 'Browsers: node-20, ${{ matrix.os }}'

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
      fail-fast: false

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: 20

      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
      - uses: browser-actions/setup-firefox@634a60ccd6599686158cf5a570481b4cd30455a2 # v1.5.4

      - name: Install
        run: pnpm i

      - name: Install Playwright Dependencies
        run: pnpm exec playwright install --with-deps --only-shell

      - name: Build
        run: pnpm run build

      - name: Test Browser (playwright)
        run: pnpm run test:browser:playwright

      - name: Test Browser (webdriverio)
        run: pnpm run test:browser:webdriverio

  test-rolldown:
    # macos-latest is the fastes one
    name: 'Rolldown&Test: node-20, macos-latest'
    # Disabled for the seal build: this is an upstream canary that re-runs the
    # same suites against `vite@npm:rolldown-vite` resolved unpinned from the
    # registry. rolldown-vite 7.3.1 (now itself deprecated in favour of Vite 8)
    # warns on `optimizeDeps.rollupOptions`, which vitest 3.2.7 sets, so
    # `configLoader runner`'s `expect(stderr).toBe('')` can no longer hold, and
    # pinning the resolution to the release-date registry does not roll it back.
    # No test coverage is lost: test:ci, test:examples and
    # test:browser:playwright all run on the supported Vite in `test` and
    # `test-browser`.
    if: false
    runs-on: macos-latest

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: 20

      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3

      - name: Install
        env:
          npm_config_registry: 'https://:2026-07-06@time-machines-npm.sealsecurity.io/'
        run: git config user.email "ci@example.com" && git config user.name "ci" && pnpm add vite@npm:rolldown-vite && git add . && git commit -m "ci" && pnpm i --prefer-offline --no-frozen-lockfile

      - name: Install Playwright Dependencies
        run: pnpm exec playwright install --with-deps --only-shell

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:ci

      - name: Test Examples
        run: pnpm run test:examples

      - name: Test Browser (playwright)
        run: pnpm run test:browser:playwright
